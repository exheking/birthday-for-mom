<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="famGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1eb"/>
      <stop offset="100%" stop-color="#ace0f9"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#famGrad)"/>
  
  <!-- Decorative Background Elements -->
  <circle cx="100" cy="100" r="60" fill="#ffd166" opacity="0.3"/>
  <circle cx="500" cy="120" r="80" fill="#ff6b6b" opacity="0.2"/>
  <circle cx="480" cy="500" r="70" fill="#4ecdc4" opacity="0.3"/>
  <circle cx="120" cy="480" r="50" fill="#9575cd" opacity="0.25"/>

  <!-- Frame Outline -->
  <rect x="30" y="30" width="540" height="540" rx="25" fill="none" stroke="#fff" stroke-width="8" stroke-dasharray="15 10"/>

  <!-- Centered Card -->
  <rect x="70" y="70" width="460" height="460" rx="30" fill="#ffffff" opacity="0.9" filter="drop-shadow(0 10px 20px rgba(0,0,0,0.08))"/>

  <!-- Main Illustration: Happy Family -->
  <text x="300" y="240" font-size="110" text-anchor="middle" dominant-baseline="middle">👨‍👩‍👧</text>
  <text x="210" y="150" font-size="40">✨</text>
  <text x="370" y="150" font-size="40">💖</text>

  <!-- Sweet Titles -->
  <text x="300" y="350" font-family="'PingFang SC', 'Microsoft JhengHei', sans-serif" font-size="36" font-weight="bold" fill="#333" text-anchor="middle">最幸福的我們一家</text>
  <text x="300" y="400" font-family="'PingFang SC', 'Microsoft JhengHei', sans-serif" font-size="20" fill="#e11d48" font-weight="600" text-anchor="middle">Our Sweet Family Memories</text>
  <text x="300" y="450" font-family="'PingFang SC', 'Microsoft JhengHei', sans-serif" font-size="16" fill="#888" text-anchor="middle">(此處可替換為您最滿意的一張全家福大合照)</text>
</svg>
