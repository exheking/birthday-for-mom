<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250">
  <defs>
    <!-- 濾鏡：柔和投影 -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#a64c61" flood-opacity="0.22" />
    </filter>
    <filter id="wheelShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25" />
    </filter>
    <filter id="goldShine" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#fef08a" flood-opacity="0.8" />
    </filter>

    <!-- 車斗主體粉紅立體漸層 -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffb8c6" />
      <stop offset="35%" stop-color="#f78da7" />
      <stop offset="85%" stop-color="#e06282" />
      <stop offset="100%" stop-color="#c43d63" />
    </linearGradient>

    <!-- 車斗外翻邊緣立體漸層 -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#ffd5df" />
      <stop offset="100%" stop-color="#f8a5ba" />
    </linearGradient>

    <!-- 香檳金色漸層 -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8db" />
      <stop offset="30%" stop-color="#f6d365" />
      <stop offset="70%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#9a7b2c" />
    </linearGradient>

    <!-- 金色把手柱立體漸層 -->
    <linearGradient id="goldBarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37" />
      <stop offset="40%" stop-color="#fff9e6" />
      <stop offset="70%" stop-color="#f1c40f" />
      <stop offset="100%" stop-color="#aa820a" />
    </linearGradient>

    <!-- 遮陽篷粉白漸層 -->
    <linearGradient id="canopyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff5f7" />
      <stop offset="40%" stop-color="#fedce3" />
      <stop offset="100%" stop-color="#fcaec0" />
    </linearGradient>

    <!-- 內部柔軟雲朵白色墊被 -->
    <linearGradient id="cushionGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#fdf4f6" />
      <stop offset="100%" stop-color="#fae3e8" />
    </linearGradient>

    <!-- 輪胎膠質漸層 -->
    <linearGradient id="tireGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#fff9f5" />
      <stop offset="85%" stop-color="#f1dfd5" />
      <stop offset="100%" stop-color="#dbc5ba" />
    </linearGradient>

    <!-- 輪胎深色陰影 -->
    <radialGradient id="wheelHubGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#ffdbe4" />
      <stop offset="85%" stop-color="#f06292" />
      <stop offset="100%" stop-color="#ad1457" />
    </radialGradient>

    <!-- 底部地面柔和陰影 -->
    <radialGradient id="groundShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(104, 32, 53, 0.32)" />
      <stop offset="60%" stop-color="rgba(104, 32, 53, 0.12)" />
      <stop offset="100%" stop-color="rgba(104, 32, 53, 0)" />
    </radialGradient>
  </defs>

  <!-- 1. 底部地面微影 -->
  <ellipse cx="200" cy="236" rx="145" ry="12" fill="url(#groundShadow)" />

  <!-- 2. 後方金色推車把手桿 (高雅雙向支架) -->
  <g id="handle">
    <!-- 左支撐斜桿 -->
    <path d="M 108 150 L 76 68 Q 72 58 84 56 L 102 54" 
          fill="none" stroke="url(#goldBarGrad)" stroke-width="7" stroke-linecap="round" />
    <!-- 右支撐斜桿 -->
    <path d="M 292 150 L 324 68 Q 328 58 316 56 L 298 54" 
          fill="none" stroke="url(#goldBarGrad)" stroke-width="7" stroke-linecap="round" />
    <!-- 頂部橫向推桿 (微弧度，中央有防滑皮革質感包覆) -->
    <path d="M 76 60 Q 200 42 324 60" 
          fill="none" stroke="url(#goldBarGrad)" stroke-width="8" stroke-linecap="round" />
    <!-- 中央奶茶色皮革握把 -->
    <path d="M 140 51 Q 200 46 260 51" 
          fill="none" stroke="#d49b6a" stroke-width="9.5" stroke-linecap="round" />
    <path d="M 140 51 Q 200 46 260 51" 
          fill="none" stroke="#fff1e0" stroke-width="2.5" stroke-linecap="round" opacity="0.75" />
    <!-- 握把兩側金屬固定環 -->
    <ellipse cx="138" cy="51" rx="4" ry="6" fill="url(#goldGrad)" />
    <ellipse cx="262" cy="51" rx="4" ry="6" fill="url(#goldGrad)" />

    <!-- 懸掛在把手上的搖晃小金星吊飾 -->
    <line x1="168" y1="50" x2="168" y2="72" stroke="url(#goldGrad)" stroke-width="1.8" />
    <path d="M 168 70 L 171 76 L 177 77 L 172.5 81 L 174 87 L 168 83.5 L 162 87 L 163.5 81 L 159 77 L 165 76 Z" 
          fill="url(#goldGrad)" filter="url(#goldShine)" />
  </g>

  <!-- 3. 後方金色 X 型交叉車架 -->
  <g id="chassis">
    <line x1="110" y1="165" x2="280" y2="210" stroke="url(#goldBarGrad)" stroke-width="6" stroke-linecap="round" />
    <line x1="290" y1="165" x2="120" y2="210" stroke="url(#goldBarGrad)" stroke-width="6" stroke-linecap="round" />
    <line x1="90" y1="210" x2="310" y2="210" stroke="url(#goldBarGrad)" stroke-width="6.5" stroke-linecap="round" />
    <!-- 中心避震轉軸金珠 -->
    <circle cx="200" cy="187" r="7" fill="url(#goldGrad)" filter="url(#goldShine)" />
  </g>

  <!-- 4. 遮陽篷後壁 (Canopy Hood - 復古圓拱型) -->
  <g id="canopy" filter="url(#softGlow)">
    <!-- 篷面底色 -->
    <path d="M 85 130 C 85 58 135 24 200 24 C 265 24 315 58 315 130 Z" 
          fill="url(#canopyGrad)" stroke="rgba(255,255,255,0.9)" stroke-width="2.5" />
    
    <!-- 遮陽篷 3 道金色弧形骨架摺痕 -->
    <path d="M 100 130 C 105 68 145 35 200 35" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" />
    <path d="M 200 24 L 200 130" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" />
    <path d="M 300 130 C 295 68 255 35 200 35" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" />

    <!-- 篷緣法式奶油波浪蕾絲邊 (Scalloped Lace Frills) -->
    <path d="M 82 126 
             Q 92 120 102 126 Q 112 120 122 126 Q 132 120 142 126 
             Q 152 120 162 126 Q 172 120 182 126 Q 192 120 202 126 
             Q 212 120 222 126 Q 232 120 242 126 Q 252 120 262 126 
             Q 272 120 282 126 Q 292 120 302 126 Q 312 120 318 126" 
          fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 82 126 
             Q 92 120 102 126 Q 112 120 122 126 Q 132 120 142 126 
             Q 152 120 162 126 Q 172 120 182 126 Q 192 120 202 126 
             Q 212 120 222 126 Q 232 120 242 126 Q 252 120 262 126 
             Q 272 120 282 126 Q 292 120 302 126 Q 312 120 318 126" 
          fill="none" stroke="#f6d365" stroke-width="1.8" stroke-linecap="round" />

    <!-- 篷頂立體皇冠/蝴蝶結小飾品 -->
    <g transform="translate(200, 22)">
      <!-- 蝴蝶結左翼 -->
      <path d="M 0 0 C -10 -8 -16 2 -4 5 Z" fill="url(#goldGrad)" />
      <!-- 蝴蝶結右翼 -->
      <path d="M 0 0 C 10 -8 16 2 4 5 Z" fill="url(#goldGrad)" />
      <!-- 蝴蝶結中心圓珠 -->
      <circle cx="0" cy="1" r="3.5" fill="#fff" stroke="url(#goldGrad)" stroke-width="1.2" />
    </g>
  </g>

  <!-- 5. 舒適內襯白雲棉被與小枕頭 (Interior Cushion & Pillow) -->
  <g id="cushion">
    <!-- 內襯軟墊深度凹面 -->
    <ellipse cx="200" cy="132" rx="105" ry="32" fill="#e898aa" />
    <!-- 雲朵軟綿白被 (超飽滿，方便接住掉下來的照片) -->
    <path d="M 98 132 C 98 116 142 110 200 110 C 258 110 302 116 302 132 C 302 152 258 160 200 160 C 142 160 98 152 98 132 Z" 
          fill="url(#cushionGrad)" />
    <!-- 軟綿綿蓬鬆壓紋 -->
    <path d="M 125 130 Q 160 142 200 134 Q 240 142 275 130" fill="none" stroke="#f5c2cd" stroke-width="2.2" stroke-dasharray="4,3" />

    <!-- 超可愛小愛心粉紅抱枕 -->
    <path d="M 200 126 C 200 120 193 116 187 119 C 181 122 181 129 200 142 C 219 129 219 122 213 119 C 207 116 200 120 200 126 Z" 
          fill="#ff6b8b" stroke="#ffffff" stroke-width="1.5" />
  </g>

  <!-- 6. 推車車斗主體 (Bassinet Body - 飽滿Q彈法式搖籃) -->
  <g id="strollerBody" filter="url(#softGlow)">
    <!-- 車斗外殼立體圓弧造型 -->
    <path d="M 80 128 
             C 80 120 100 118 130 118 
             L 270 118 
             C 300 118 320 120 320 128 
             C 320 178 285 204 200 204 
             C 115 204 80 178 80 128 Z" 
          fill="url(#bodyGrad)" stroke="#ffffff" stroke-width="3" />

    <!-- 車斗高光弧度亮點 (光澤質感) -->
    <path d="M 98 136 C 98 170 132 192 200 192" 
          fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="4.5" stroke-linecap="round" />

    <!-- 車身菱格紋刺繡線條 (Luxury Quilted Pattern) -->
    <g stroke="rgba(255, 235, 240, 0.45)" stroke-width="1.6" fill="none">
      <path d="M 115 135 L 175 195" />
      <path d="M 145 125 L 215 195" />
      <path d="M 185 122 L 255 192" />
      <path d="M 225 122 L 285 182" />
      
      <path d="M 285 135 L 225 195" />
      <path d="M 255 125 L 185 195" />
      <path d="M 215 122 L 145 192" />
      <path d="M 175 122 L 115 182" />
    </g>

    <!-- 車身菱格交叉點小珍珠點綴 -->
    <g fill="#ffffff">
      <circle cx="160" cy="150" r="1.8" />
      <circle cx="200" cy="142" r="2.2" />
      <circle cx="240" cy="150" r="1.8" />
      <circle cx="180" cy="170" r="2" />
      <circle cx="220" cy="170" r="2" />
      <circle cx="200" cy="184" r="1.8" />
    </g>

    <!-- 車斗上緣外翻厚實包邊 (Plump Padded Rim) -->
    <path d="M 72 126 
             C 72 116 110 114 200 114 
             C 290 114 328 116 328 126 
             C 328 134 290 138 200 138 
             C 110 138 72 134 72 126 Z" 
          fill="url(#rimGrad)" stroke="url(#goldGrad)" stroke-width="2" />

    <!-- 包邊正上方細緻珍珠鍊邊飾 -->
    <path d="M 84 125 Q 200 131 316 125" 
          fill="none" stroke="#fff8e7" stroke-width="2.5" stroke-dasharray="3,4" stroke-linecap="round" />

    <!-- 車身正前方立體燙金浮雕蝴蝶結徽章 -->
    <g transform="translate(200, 160)">
      <!-- 左右緞帶飄帶 -->
      <path d="M -4 5 Q -14 18 -18 24 Q -12 21 -4 14" fill="url(#goldGrad)" />
      <path d="M 4 5 Q 14 18 18 24 Q 12 21 4 14" fill="url(#goldGrad)" />
      <!-- 蝴蝶結左瓣 -->
      <path d="M 0 0 C -18 -14 -24 8 -2 5 Z" fill="url(#goldGrad)" filter="url(#goldShine)" />
      <!-- 蝴蝶結右瓣 -->
      <path d="M 0 0 C 18 -14 24 8 2 5 Z" fill="url(#goldGrad)" filter="url(#goldShine)" />
      <!-- 核心粉紅寶石愛心 -->
      <path d="M 0 -2 C 0 -6 -5 -8 -7 -5 C -9 -2 -6 3 0 8 C 6 3 9 -2 7 -5 C 5 -8 0 -6 0 -2 Z" 
            fill="#e91e63" stroke="#fff" stroke-width="1.2" />
    </g>
  </g>

  <!-- 7. 可愛圓滾滾大車輪 (Chibi Luxury Wheels - 4 輪立體透視) -->
  <!-- 左後輪 (透視偏小偏暗) -->
  <g id="backWheelLeft" filter="url(#wheelShadow)">
    <circle cx="106" cy="192" r="24" fill="url(#tireGrad)" stroke="#c5a059" stroke-width="2.5" />
    <circle cx="106" cy="192" r="17" fill="url(#goldGrad)" />
    <circle cx="106" cy="192" r="13" fill="#ffffff" />
    <circle cx="106" cy="192" r="7" fill="url(#wheelHubGrad)" />
  </g>

  <!-- 右後輪 (透視偏小偏暗) -->
  <g id="backWheelRight" filter="url(#wheelShadow)">
    <circle cx="294" cy="192" r="24" fill="url(#tireGrad)" stroke="#c5a059" stroke-width="2.5" />
    <circle cx="294" cy="192" r="17" fill="url(#goldGrad)" />
    <circle cx="294" cy="192" r="13" fill="#ffffff" />
    <circle cx="294" cy="192" r="7" fill="url(#wheelHubGrad)" />
  </g>

  <!-- 左前大主輪 (前方清晰飽滿) -->
  <g id="frontWheelLeft" filter="url(#wheelShadow)">
    <!-- 輪胎白橡膠厚圈 -->
    <circle cx="86" cy="214" r="30" fill="url(#tireGrad)" stroke="#e2c8a2" stroke-width="3" />
    <circle cx="86" cy="214" r="28" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="2" />
    <!-- 燙金輪框 -->
    <circle cx="86" cy="214" r="22" fill="url(#goldGrad)" filter="url(#goldShine)" />
    <circle cx="86" cy="214" r="17" fill="#ffffff" />
    <!-- 8 根精緻金色輪輻 -->
    <g stroke="url(#goldGrad)" stroke-width="2.2" stroke-linecap="round">
      <line x1="86" y1="197" x2="86" y2="231" />
      <line x1="69" y1="214" x2="103" y2="214" />
      <line x1="74" y1="202" x2="98" y2="226" />
      <line x1="74" y1="226" x2="98" y2="202" />
    </g>
    <!-- 中心粉紅寶石立體軸蓋 -->
    <circle cx="86" cy="214" r="8.5" fill="url(#wheelHubGrad)" stroke="#ffffff" stroke-width="2" />
    <circle cx="83.5" cy="211.5" r="2.5" fill="#ffffff" opacity="0.85" />
  </g>

  <!-- 右前大主輪 (前方清晰飽滿) -->
  <g id="frontWheelRight" filter="url(#wheelShadow)">
    <!-- 輪胎白橡膠厚圈 -->
    <circle cx="314" cy="214" r="30" fill="url(#tireGrad)" stroke="#e2c8a2" stroke-width="3" />
    <circle cx="314" cy="214" r="28" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="2" />
    <!-- 燙金輪框 -->
    <circle cx="314" cy="214" r="22" fill="url(#goldGrad)" filter="url(#goldShine)" />
    <circle cx="314" cy="214" r="17" fill="#ffffff" />
    <!-- 8 根精緻金色輪輻 -->
    <g stroke="url(#goldGrad)" stroke-width="2.2" stroke-linecap="round">
      <line x1="314" y1="197" x2="314" y2="231" />
      <line x1="297" y1="214" x2="331" y2="214" />
      <line x1="302" y1="202" x2="326" y2="226" />
      <line x1="302" y1="226" x2="326" y2="202" />
    </g>
    <!-- 中心粉紅寶石立體軸蓋 -->
    <circle cx="314" cy="214" r="8.5" fill="url(#wheelHubGrad)" stroke="#ffffff" stroke-width="2" />
    <circle cx="311.5" cy="211.5" r="2.5" fill="#ffffff" opacity="0.85" />
  </g>

  <!-- 8. 車體周圍微閃光星點 (Sparkles) -->
  <g fill="#fef08a" opacity="0.9">
    <path d="M 68 106 Q 74 106 74 100 Q 74 106 80 106 Q 74 106 74 112 Q 74 106 68 106 Z" />
    <path d="M 326 95 Q 330 95 330 91 Q 330 95 334 95 Q 330 95 330 99 Q 330 95 326 95 Z" />
    <circle cx="200" cy="100" r="1.8" fill="#ffffff" />
  </g>
</svg>
